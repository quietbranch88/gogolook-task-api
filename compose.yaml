name: gogolook-tasks
services:
  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: tasks
    volumes:
      - tasks-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the Unix socket: the image's entrypoint runs a temporary init server that
      # answers pg_isready on the socket before the real server starts, which let a
      # first `up --build` on a fresh volume report healthy and then fail migrate.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U tasks -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    image: gogolook-tasks:local
    command: [migrate]
    environment:
      DATABASE_URL: postgres://tasks:local-demo-only@db:5432/tasks?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  seed:
    image: gogolook-tasks:local
    command: [seed-demo]
    environment:
      DATABASE_URL: postgres://tasks:local-demo-only@db:5432/tasks?sslmode=disable
      AUTH_MODE: demo
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    image: gogolook-tasks:local
    restart: unless-stopped
    # The application drains for up to 10s; allow another 10s for cleanup/exit.
    stop_grace_period: 20s
    environment:
      DATABASE_URL: postgres://tasks:local-demo-only@db:5432/tasks?sslmode=disable
      AUTH_MODE: demo
    # API_PORT only changes the host side of the mapping; inside the container the API
    # listens on 8080 (HTTP_ADDR=:8080 comes from the Dockerfile).
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      seed:
        condition: service_completed_successfully
  test-db:
    image: postgres:17.11
    profiles: [test]
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: tasks_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U tasks -d tasks_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
    profiles: [test]
    working_dir: /src
    volumes: [".:/src:ro", "go-modules:/go/pkg/mod", "go-test-cache:/root/.cache/go-build"]
    environment:
      TEST_DATABASE_URL: postgres://tasks:local-test-only@test-db:5432/tasks_test?sslmode=disable
      TEST_ALLOW_DATABASE: tasks_test
    command: [go, test, -race, -count=1, -v, ./...]
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  tasks-data:
  go-modules:
  go-test-cache:
